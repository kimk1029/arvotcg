<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14A085"/>
      <stop offset="1" stop-color="#0A5C4B"/>
    </linearGradient>
  </defs>
  <!-- 브랜드 틸 라운드 스퀘어 (클린 테마 accent) -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 부채꼴로 겹친 카드 3장 — TCG 상징 -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-opacity=".4">
    <rect x="9" y="14" width="21" height="30" rx="3" opacity=".22" transform="rotate(-16 19.5 29)"/>
    <rect x="34" y="14" width="21" height="30" rx="3" opacity=".22" transform="rotate(16 44.5 29)"/>
    <rect x="21.5" y="12.5" width="21" height="30" rx="3" opacity=".32"/>
  </g>
  <!-- ARVO / TCG 워드마크 -->
  <g fill="#FFFFFF" font-family="'DejaVu Sans','Arial Narrow',Arial,sans-serif" font-weight="bold" text-anchor="middle">
    <text x="32" y="31.5" font-size="15" letter-spacing="0.5">ARVO</text>
    <text x="32" y="46.5" font-size="15" letter-spacing="1">TCG</text>
  </g>
</svg>
