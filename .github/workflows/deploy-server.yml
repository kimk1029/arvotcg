name: Deploy Server (reusable)

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
    secrets:
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_KEY:
        required: false
      SSH_PORT:
        required: false
      SERVER_ENV:
        required: false

jobs:
  safety:
    name: Outage regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx tsx --test server/lib/resilience.test.ts

  deploy:
    needs: safety
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    # 같은 호스트의 서버/어드민만 직렬화한다. NAS와 Vultr는 독립 실행.
    concurrency:
      group: deploy-host-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - name: Resolve target
        id: gate
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Host secret is not configured; skipping deployment"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH & deploy server
        if: steps.gate.outputs.run == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          # `.env` 는 .gitignore 라 git pull 로 안 옴. GitHub Secret 에
          # `.env` 파일 내용 전체를 넣어두면 배포 시 server/.env 로 기록.
          # 비워두면 대상 서버에 이미 놓인 파일을 그대로 사용.
          # 대상별 전용 시크릿만 사용한다. vultr(운영) 에 VULTR_SERVER_ENV 가 없으면
          # NAS(stage) 의 SERVER_ENV 로 덮어쓰지 않고 서버에 있는 .env 를 유지한다.
          SERVER_ENV_CONTENT: ${{ secrets.SERVER_ENV }}
          DEPLOY_DIR: /root/dev/pokefesta30
          DEPLOY_TARGET: ${{ inputs.target }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # NAS 의 npm ci 두 번(서버+루트)만 10분 가까이 걸려 기본 10m 으론 pm2 재시작 전에
          # "Run Command Timeout" 으로 죽는다 (2026-08-06 실사고). 여유 있게 30분.
          # (Vultr 는 보통 1~2분이면 끝나지만 같은 여유를 준다.)
          command_timeout: 30m
          envs: SERVER_ENV_CONTENT,DEPLOY_DIR,DEPLOY_TARGET
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "=== deploy target: $DEPLOY_TARGET ($DEPLOY_DIR) ==="
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard "${{ github.sha }}"

            cd server

            # 1) .env 준비: SERVER_ENV secret 이 있으면 그걸로 덮어쓰기.
            #    secret 이 비어있고 파일도 없으면 fail-fast.
            if [ -n "${SERVER_ENV_CONTENT:-}" ]; then
              printf '%s\n' "$SERVER_ENV_CONTENT" > .env
              chmod 600 .env
              echo "✓ server/.env 갱신 ($(wc -l < .env) lines)"
            elif [ ! -f .env ]; then
              echo "::error::server/.env 가 없고 SERVER_ENV secret 도 비어있습니다."
              echo "::error::방법1) GitHub repo settings → Secrets 에 SERVER_ENV 추가 (로컬 server/.env 내용 전체)"
              echo "::error::방법2) 대상 서버에 SSH 후 cp .env.example .env, 값 채우기"
              exit 1
            else
              echo "✓ 기존 server/.env 사용"
            fi

            # 2) 의존성 + Prisma client (postinstall 이 server-local client 삭제 →
            #    Node 모듈 해소가 root/node_modules 로 walk up. 그래서 root 도 설치 필요.)
            npm ci --prefer-offline --no-audit --no-fund
            cd "$DEPLOY_DIR"
            npm ci --prefer-offline --no-audit --no-fund
            npx prisma generate
            # Apply any pending DB migrations. Non-fatal: the admin
            # workflow owns schema via `prisma db push`, which doesn't
            # update the _prisma_migrations ledger. If `migrate deploy`
            # sees that drift it errors — but the server restart below
            # is what we actually need. Log + continue.
            set -a; . ./server/.env; set +a
            npx prisma migrate deploy || echo "::warning::prisma migrate deploy failed — continuing (admin db push owns schema)"

            # Idempotent safety-net: even if `migrate deploy` no-ops due to
            # drift, run the manual SQL (IF NOT EXISTS clauses) to make sure
            # the columns / tables the code expects actually exist.
            # 두 대상이 같은 Supabase 를 보므로 멱등(IF NOT EXISTS)이라 중복 실행해도 안전.
            npx prisma db execute \
              --file prisma/manual/ensure_snkrdunk_schema.sql \
              --schema prisma/schema.prisma \
              && echo "✓ ensure_snkrdunk_schema.sql applied" \
              || echo "::warning::ensure_snkrdunk_schema.sql failed — check DB"

            npx prisma db execute --file prisma/manual/ensure_current_prices.sql --schema prisma/schema.prisma

            # 3) ecosystem.config.cjs 가 단일 진실 소스. exec_mode 같은 구조 변경은
            #    reload 로는 안 잡혀서, 항상 delete → start 로 깨끗하게 재기동.
            pm2 delete pokefesta30-server >/dev/null 2>&1 || true
            # 고아 프로세스가 :3030 을 물고 있으면(과거 npm 래퍼 시절 pm2 delete 가
            # tsx 자식을 못 죽여 EADDRINUSE 크래시 루프) 새 인스턴스가 영원히 못 뜬다
            # — 시작 전에 포트 점유 프로세스를 정리.
            # Synology 는 netstat, 최신 Ubuntu 는 ss 만 있는 경우가 있어 둘 다 시도한다.
            fuser -k 3030/tcp 2>/dev/null || true
            # ss 로 :3030 리스너만 조회 → 없거나 ss 자체가 없으면 netstat 로 폴백.
            PORT_PIDS=$(ss -tlnp 'sport = :3030' 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)
            if [ -z "$PORT_PIDS" ]; then
              PORT_PIDS=$(netstat -tlnp 2>/dev/null | awk '$4 ~ /:3030$/ {split($NF,a,"/"); print a[1]}' | grep -E '^[0-9]+$' | sort -u || true)
            fi
            [ -n "$PORT_PIDS" ] && kill -9 $PORT_PIDS 2>/dev/null || true
            sleep 2
            pm2 start ecosystem.config.cjs --only pokefesta30-server
            pm2 save

            # DB 준비 상태 확인 — 연결 풀과 현재가 테이블 조회 성공 필수 (약 120초 제한).
            # delete→start + npm ci 직후엔 tsx 콜드 스타트가 30초를 훌쩍 넘길
            # 수 있어(2026-07-15 실사례: 40초+에 정상 기동) 넉넉히 기다린다.
            DEADLINE=$(( $(date +%s) + 120 ))
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              if curl --connect-timeout 2 --max-time 4 -sf http://127.0.0.1:3030/ready >/dev/null 2>&1; then
                echo "✓ [$DEPLOY_TARGET] server is up on :3030 (DB readiness passed)"
                exit 0
              fi
              echo "…waiting for :3030/ready"
              sleep 1
            done
            echo "::error::[$DEPLOY_TARGET] server readiness failed on :3030/ready within 120s"
            echo "--- :3030 port holders ---"
            { ss -tlnp 2>/dev/null | grep 3030 || netstat -tlnp 2>/dev/null | grep 3030; } || true
            pm2 logs pokefesta30-server --lines 80 --nostream || true
            pm2 describe pokefesta30-server || true
            exit 1
