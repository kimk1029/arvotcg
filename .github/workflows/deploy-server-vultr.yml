name: Deploy Server — Vultr

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/lib/**'
      - 'shared/**'
      - 'prisma/schema.prisma'
      - 'prisma/manual/**'
      - 'ecosystem.config.cjs'
      - '.github/workflows/deploy-server.yml'
      - '.github/workflows/deploy-server-vultr.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-server.yml
    with:
      target: vultr
    secrets:
      SSH_HOST: ${{ secrets.VULTR_SSH_HOST }}
      SSH_USER: ${{ secrets.VULTR_SSH_USER }}
      SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
      SSH_PORT: ${{ secrets.VULTR_SSH_PORT }}
      SERVER_ENV: ${{ secrets.VULTR_SERVER_ENV }}
